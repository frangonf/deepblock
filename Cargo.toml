[workspace]
resolver = "2"
members = ["apps/server", "apps/cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["DeepBlock contributors <frangonf@users.noreply.github.com>"]
repository = "https://github.com/frangonf/deepblock"

[workspace.dependencies]
anyhow = "=1.0.104"
axum = { version = "=0.8.9", features = ["macros", "ws"] }
chrono = { version = "=0.4.45", features = ["clock", "serde"] }
clap = { version = "=4.6.7", features = ["derive", "env"] }
dirs = "=7.0.0"
futures-util = "=0.3.34"
http-body-util = "=0.1.5"
nix = { version = "=0.32.0", default-features = false, features = ["signal", "process"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "query", "rustls", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = "=2.12.4"
tauri-build = "=2.7.4"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["full"] }
tokio-tungstenite = { version = "=0.30.0", features = ["connect"] }
toml = "=1.2.1"
tower = "=0.5.3"
tower-http = { version = "=0.7.1", features = ["cors"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.29.2", features = ["v4"] }
