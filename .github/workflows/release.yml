name: Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Release quality gates
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read # Test the dispatched commit.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reclaim runner disk for the quality gates
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghcup
          df -h /
      - name: Install desktop development dependencies
        timeout-minutes: 8
        uses: $/.github/actions/setup-apt
        with:
          profile: desktop
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install locked tools
        timeout-minutes: 5
        run: |
          mise install --locked node pnpm rust mr-boxington shellcheck
          mise exec -- rustup component add rustfmt clippy
      - name: Install locked frontend dependencies
        timeout-minutes: 3
        run: pnpm install --frozen-lockfile
      - name: Install browser system dependencies
        timeout-minutes: 8
        uses: $/.github/actions/setup-apt
        with:
          profile: chromium
      - name: Download Chromium without another APT transaction
        timeout-minutes: 5
        run: pnpm -C apps/desktop/ui exec playwright install chromium
      - name: Run shared project quality tasks
        env:
          # One-shot CI compiles: disable incremental artifacts to bound disk use.
          CARGO_INCREMENTAL: '0'
        run: |
          mise run lint:rust
          mise run lint:desktop
          mise run lint:scripts
          mise run licenses:bundle
          mise run version:check
          # Serialized deliberately: parallel cargo tasks contend for the workspace
          # target-dir lock, and Playwright's `cargo run` webServer times out.
          mise run test:rust
          mise run test:scripts
          mise run test:desktop
          # This is a debug workspace/frontend build, not a release bundle.
          # Keep test artifacts so the workspace build can reuse them.
          mise run build

  macos:
    name: macOS (aarch64-apple-darwin)
    needs: quality
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read # Build ad-hoc macOS bundles.
    env:
      DEEPBLOCK_BUILD_TARGET: aarch64-apple-darwin
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install locked build tools
        timeout-minutes: 5
        run: |
          mise install --locked node pnpm rust mr-boxington
          pnpm install --frozen-lockfile
      - name: Build with Tauri and collect packages
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          mise run build:tools
          node scripts/build.ts bundle
          mise run release:collect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-aarch64-apple-darwin
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  debian:
    name: Debian 12 amd64 build
    # Gate the expensive Linux build on macOS success instead of spending more
    # minutes after a platform failure. No actions:write cancellation token.
    needs: macos
    runs-on: ubuntu-26.04
    container: debian:12-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc
    timeout-minutes: 45
    permissions:
      contents: read # Build Debian packages.
    env:
      DEEPBLOCK_BUILD_TARGET: x86_64-unknown-linux-gnu
      CARGO_INCREMENTAL: '0'
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install checkout prerequisites
        timeout-minutes: 3
        run: |
          # No checkout/action files exist yet in the clean Debian container.
          limits=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any)
          apt-get "${limits[@]}" update
          apt-get "${limits[@]}" install -y --no-install-recommends git ca-certificates curl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Debian build dependencies
        timeout-minutes: 8
        uses: $/.github/actions/setup-apt
        with:
          profile: debian
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install locked tools
        timeout-minutes: 5
        run: |
          mise install --locked node pnpm rust mr-boxington
          pnpm install --frozen-lockfile
      - name: Build packages
        run: |
          mise run build:tools
          node scripts/build.ts bundle
          node scripts/debian.ts
          mise run release:collect
      # Keep diagnostic packages even when the native test fails. Installation
      # and candidate assembly still require the whole job to succeed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-x86_64-unknown-linux-gnu
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Native WebKit UI compatibility
        timeout-minutes: 5
        # Reuse the compiled release application; no second build or Cargo GC.
        # Only this disposable root container disables WebKit sandboxing.
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
          DEEPBLOCK_TAURI_E2E_APP: ${{ github.workspace }}/target/x86_64-unknown-linux-gnu/release/deepblock-desktop
        run: node apps/desktop/ui/scripts/run-tauri-e2e.ts

  debian-install:
    name: Debian ${{ matrix.version }} package installation
    needs: debian
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # Read the smoke-test script and this run's packages.
    strategy:
      fail-fast: true
      matrix:
        include:
          - version: '12'
            image: debian:12-slim@sha256:99c0b25c46d0214d5a2091092e7908907dcaecd6a962cde0ac700acee222b6f3
          - version: '13'
            image: debian:13-slim@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-x86_64-unknown-linux-gnu
          path: dist/release
      - name: Install and exercise packages on a clean system
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --mount "type=bind,source=$PWD/dist/release,target=/assets,readonly" \
            --mount "type=bind,source=$PWD/scripts/debian-smoke.sh,target=/smoke.sh,readonly" \
            --mount "type=bind,source=$PWD/scripts/ci-apt.sh,target=/ci-apt.sh,readonly" \
            --env DEBIAN_FRONTEND=noninteractive \
            "$IMAGE" bash -e -c 'bash /ci-apt.sh configure && exec bash /smoke.sh'

  assemble:
    name: Verify complete download set
    needs: [macos, debian-install]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # Assemble artifacts from this workflow run only.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.25
          install: false
          cache: false
      - name: Install locked asset verification dependencies
        timeout-minutes: 5
        run: |
          mise install --locked node pnpm
          pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist/release
      - name: Verify assets and write checksums
        run: node scripts/release.ts assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
