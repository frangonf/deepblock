/* Primary actions keep their paired fill and text colour on hover. */

/* A quiet, visible scrollbar preserves schedule navigation. */

.system-calendar-wrap::-webkit-scrollbar-thumb:hover{background:#787068}

<script>

const states={calm:makeState(),workspace:makeState(),system:makeState()};Object.values(states).forEach(s=>s.savedTasks=clone(s.tasks));states.system.blocks[2].title='Write the first draft: explain how revision history protects the plan';states.system.saved=clone(states.system.blocks);states.system.revisions[0].blocks=clone(states.system.blocks);let failNextSave=false,saveError=false;const state=()=>states[study];

function render(){const s=state();$('#app').className='app '+(study==='workspace'?'workspace '+(dark?'dark':''):study==='system'?'system'+(view==='planner'?' system-planning':''):'system')+(fullFocus&&study==='calm'?' focus-only':'');document.querySelectorAll('[data-study]').forEach(b=>{b.classList.toggle('active',b.dataset.study===study);b.setAttribute('aria-pressed',b.dataset.study===study)});

function calm(){const s=state();let current=s.blocks.find(b=>b.id===s.selected&&!b.done)||s.blocks.find(b=>!b.done);if(current)s.selected=current.id;const upcoming=current?s.blocks.filter(b=>!b.done&&b.id!==current.id).sort((a,b)=>mins(a.start)-mins(b.start))[0]:null;return '<main class="focus-layout"><div class="dayhead"><div><h1>Sunday <span class="muted">4 October</span></h1><div class="date">'+s.blocks.filter(b=>!b.done).length+' blocks remaining</div></div><button id="focus-mode" class="plain">Focus mode</button></div><section class="focus-card"><div class="eyebrow">'+(current?current.start+'–'+end(current)+' · '+current.kind:'Plan complete')+'</div><h2>'+esc(current?current.title:'Room to stop.')+'</h2><p>'+esc(current?current.note||'One block at a time.':'Your remaining time is free.')+'</p>'+(current?'<div class="focus-bottom"><button class="primary" id="timer-toggle">'+(s.running?'Pause':'Start focus')+'</button><button id="complete-current">Record outcome</button><button class="plain" data-edit="'+current.id+'">Edit block</button><span class="timer" id="timer">'+timerText()+'</span></div>':'')+'</section>'+(upcoming?'<div class="next-row"><div><span class="eyebrow">Up next</span><strong>'+esc(upcoming.title)+'</strong></div><time>'+upcoming.start+'–'+end(upcoming)+'</time></div>':'')+'<div class="lower"><button class="plain" id="schedule-toggle">'+(showSchedule?'Hide':'Show')+' day plan</button><button class="plain" data-history>Revisions</button><span class="status">'+(s.dirty?'Unsaved changes':'Revision '+s.revisions[0].id+' saved')+'</span>'+(s.dirty?'<button data-discard class="plain">Discard</button><button class="primary" data-save>Save revision</button>':'')+'</div>'+(showSchedule?'<div class="schedule-list">'+s.blocks.slice().sort((a,b)=>mins(a.start)-mins(b.start)).map(b=>'<div class="schedule-row '+(b.done?'done':'')+'"><time>'+b.start+'–'+end(b)+'</time><strong>'+esc(b.title)+'</strong><button class="plain" data-edit="'+b.id+'">Edit</button></div>').join('')+'<button data-new class="plain" style="margin-top:15px">+ Add block</button></div>':'')+'</main>'+(fullFocus?'<button class="exit-focus" id="exit-focus">Exit focus mode</button>':'')}

function board(){const s=state(),total=s.blocks.reduce((a,b)=>a+b.duration,0);return '<div class="toolbar"><div><h1>Daily planning <small>Sunday, 4 October 2026</small></h1></div><div class="tools"><button data-history>Plan history</button><button class="primary" data-new>+ Add block</button></div></div><main class="board-shell"><div class="board"><section class="column"><div class="colhead"><div><h2>Today</h2><small>Sunday · 4 October</small></div><span class="count">'+s.blocks.length+'</span></div>'+s.blocks.map(b=>taskCard(b,true)).join('')+'<button class="add-task" data-new>+ Add a time block</button><div class="capacity">'+format(total)+' planned · '+format(s.blocks.filter(b=>b.kind==='Focus').reduce((a,b)=>a+b.duration,0))+' focus<div class="track"><div class="fill" style="width:'+Math.min(100,total/480*100)+'%"></div></div></div></section>'+['tomorrow','later'].map(day=>'<section class="column"><div class="colhead"><div><h2>'+({tomorrow:'Tomorrow',later:'Unscheduled'})[day]+'</h2><small>'+({tomorrow:'Monday · 5 October',later:'Choose when it fits'})[day]+'</small></div><span class="count">'+s.tasks.filter(b=>b.day===day).length+'</span></div>'+s.tasks.filter(b=>b.day===day).map(b=>taskCard(b,false)).join('')+'</section>').join('')+'</div><aside class="calendar-panel"><div class="calendar-head">Today’s schedule <button data-new>+ Block</button></div><div class="calendar-wrap"><div class="calendar" id="calendar">'+Array.from({length:9},(_,i)=>'<div class="hour"><span>'+clock(540+i*60)+'</span></div>').join('')+s.blocks.map(b=>'<button class="event '+(b.done?'done':'')+'" data-edit="'+b.id+'" style="top:'+((mins(b.start)-540)*64/60+2)+'px;height:'+Math.max(20,b.duration*64/60-4)+'px">'+esc(b.title)+(b.duration>=45?'<small>'+b.start+'–'+end(b)+'</small>':'')+'</button>').join('')+'<div class="now" aria-label="Sample current time 11:41"></div></div></div><div class="drop-hint">Drag an unscheduled task here, or use “Schedule today”.</div></aside></main><footer clas '<section class="ds-section14" id="ds-components"><h2>05 · Component states</h2><div class="ds-grid14"><div class="ds-card14"><h3>Actions</h3><div class="ds-demo14"><button class="primary" data-demo-save14>Save revision</button><button data-history>History</button><button class="plain" data-view="planner">Back to planner</button><button class="primary" disabled>Save revision</button></div><p>One primary action per decision group. Secondary actions use a border; low-emphasis actions use plain text. Hover and pressed use paired action tokens. Disabled retains its shape and cannot activate.</p></div><div class="ds-card14"><h3>Labels and revision states</h3><div class="ds-demo14"><span class="tag14">Planned</span><span class="tag14 success">Completed</span><span class="tag14 pending">Unsaved</span><span class="tag14 error">Save failed</span></div><p>State uses text plus a visual cue. Completion is explicit; unsaved uses a dashed edge. Focus-work type is distinct from keyboard focus and self-rated concentration.</p></div><div class="ds-card14"><h3>Inputs and validation</h3><label class="field14">Block title<input value="Write the first draft" aria-label="Sample block title"></label><label class="field14">Start time<input value="12:00" aria-invalid="true" aria-describedby="field-error14" aria-label="Sample invalid start time"></label><div class="field-error14" id="field-error14">Overlaps another block. Choose another time.</div><p>Persistent labels, visible input boundaries and errors beside the field. Preserve entered values when validation fails.</p></div><div class="ds-card14"><h3>Calendar blocks</h3><p>Neutral tasks use a surface and muted edge. Focus blocks use the soft accent surface. Changed blocks add a dashed unsaved edge and label where height allows. Move from the left edge; resize from the lower edge. Enter opens precise editing.</p></div><div class="ds-card14"><h3>History and dialogs</h3><p>History is a timeline on desktop and a modal drawer on mobile. Each revision is a full snapshot. Restore loads a new draft. Dialogs have a title, close action, focus containment and return focus to the trigger.</p></div><div class="ds-card14"><h3>Feedback and empty states</h3><p>Save: Ready → Saving → Saved / Failed. Failures keep the draft and note intact and offer Retry. Toasts confirm minor changes; persistent errors stay beside the action. Empty day: “No blocks planned” with Add block. Empty history: “No saved revisions yet.”</p></div></div><details style="margin-top:20px"><summary>Try save-failure recovery</summary><p class="muted small">A prototype exercise: creates an unsaved change, then fails the first save. Retry keeps the same draft and revision note.</p><button id="demo-failure14">Open failure exercise</button></details></section>'+
'<section class="ds-section14" id="ds-behaviour"><h2>06 · Interaction contract</h2><div class="ds-table-scroll14"><table class="ds-table14"><thead><tr><th>Interaction</th><th>Behaviour</th><th>Recovery / alternative</th></tr></thead><tbody>'+
[['Move','Drag the left edge. Preview the destination in 15-minute steps. Release applies only to the draft.','Escape or pointer cancellation restores the original. Overlaps and out-of-range moves are rejected; Enter opens time fields.'],['Resize','Pull the lower edge; preview duration and end time. Minimum 15 minutes; sample editor maximum 240 minutes.','Invalid release preserves the previous duration. Escape cancels. Keyboard and touch users can set duration in the editor.'],['Save','Append a complete immutable revision. Show Saving and prevent duplicate submission.','Failure preserves draft, previous revisions and revision note. Retry produces one new revision.'],['Discard / restore','Discard returns to the latest saved snapshot. Restore copies an earlier snapshot into a draft.','Older revisions remain intact. Restoring does not silently save or overwrite anything.'],['Keyboard','Tab follows visible controls. Enter / Space activates buttons. N adds; H opens history; ? opens help; Ctrl / ⌘ + S opens save.','Single-key shortcuts pause in editable fields and overlays. Escape closes the top overlay. Offer a shortcut-off setting in production.'],['Touch / mobile','Scroll the schedule normally; use Edit for exact times. History opens a full-width drawer.','44px mobile control targets. No essential action depends on dragging, hovering or a permanently visible rail.'],['Notes / review','Daily notes belong to the day; planned time and recorded outcomes are shown separately.','Mock notes stay in memory. Production autosave needs explicit Saving / Saved / Failed feedback, independently of plan revision saving.']].map(row=>'<tr>'+row.map((x,i)=>'<td>'+(i?'<p>'+x+'</p>':x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></section>'+
'<section class="ds-section14" id="ds-access"><h2>07 · Accessibility and theme acceptance</h2><div class="ds-grid14"><div class="ds-card14"><h3>Contrast and focus</h3><p>Target 4.5:1 for normal text and 3:1 for large text and meaningful control boundaries. Keyboard focus has a distinct 2px outline with 3px offset. Test action text against all three fills, and state text against its associated surface.</p></div><div class="ds-card14"><h3>Accessible interaction</h3><p>Full block names remain available to assistive technology. Modal focus stays inside and returns on close. Status updates are announced; validation errors use alerts. Support 200% zoom, reduced motion and forced-colour mode.</p></div><div class="ds-card14"><h3>Before adopting a theme</h3><p>Check the planner, long titles, short blocks, unsaved revisions, failed saves, disabled controls, focused controls and history on narrow screens. Check actual rendered contrast and keyboard flows; palette previews here establish the contract, not production certification.</p></div></div></section></main>'}


let gesture14=null,suppressClick14=false,saving14=false;
function contrastRatio14(a,b){const lum=h=>{const rgb=h.trim().replace('#','').match(/../g).map(x=>parseInt(x,16)/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4);return rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722};const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
function bindSystem(){
 const app=$('#app');app.dataset.palette=palette14;app.dataset.mode=mode14;
 document.querySelectorAll('[data-study]').forEach(b=>b.onclick=()=>{study=b.dataset.study;view='planner';fullFocus=false;closeOverlay();render()});
 if($('#palette14')){$('#palette14').value=palette14;$('#palette14').onchange=e=>{palette14=e.target.value;render()}}
 if($('#mode14')){$('#mode14').value=mode14;$('#mode14').onchange=e=>{mode14=e.target.value;render()}}
 if(typeof getComputedStyle==='function'){
  const styles=getComputedStyle(app);
  document.querySelectorAll('[data-token-value]').forEach(el=>el.textContent=styles.getPropertyValue(el.dataset.tokenValue).trim());
  if($('#contrast14'))$('#contrast14').textContent=contrastRatio14(styles.getPropertyValue('--accent'),styles.getPropertyValue('--on-accent')).toFixed(2)+':1';
 }
 document.querySelectorAll('#shortcuts').forEach(b=>b.onclick=keyboardHelp);
 document.querySelectorAll('[data-plan-mode]').forEach(b=>b.onclick=()=>{planMode14=b.dataset.planMode;render()});
 if($('#rail-toggle14'))$('#rail-toggle14').onclick=()=>{historyVisible14=!historyVisible14;render()};
 if($('#demo-failure14'))$('#demo-failure14').onclick=()=>{const s=state();s.blocks[0].duration=s.blocks[0].duration===60?45:60;changed();failNextSave=true;savePanel()};
 document.querySelectorAll('[data-demo-save14]').forEach(b=>b.onclick=()=>{toast('Primary action sample. Edit a planner block to save a revision.')});
 if(study!=='system')return;
 document.querySelectorAll('[data-move-handle],[data-resize]').forEach(handle=>handle.onpointerdown=e=>{
  if(e.button!==0)return;e.preventDefault();e.stopPropagation();
  const id=Number(handle.dataset.moveHandle||handle.dataset.resize),b=state().blocks.find(x=>x.id===id),card=handle.parentElement;
  const originalStart=mins(b.start),originalDuration=b.duration,originY=e.clientY,resizing=!!handle.dataset.resize;
  let start=originalStart,duration=originalDuration,moved=false;
  const wrap=$('.system-calendar-wrap'),oldScroll=wrap.scrollTop;
  handle.setPointerCapture(e.pointerId);
  const cleanup=()=>{handle.onpointermove=null;handle.onpointerup=null;handle.onpointercancel=null;gesture14=null;try{handle.releasePointerCapture(e.pointerId)}catch{}};
  const cancel=()=>{cleanup();suppressClick14=true;render();const target=document.querySelector('[data-edit="'+id+'"]');target?.focus();toast('Change cancelled. Previous time preserved.')};
  gesture14={cancel};
  handle.onpointermove=ev=>{
   const delta=(ev.clientY-originY+wrap.scrollTop-oldScroll)*60/80;moved=moved||Math.abs(ev.clientY-originY)>3;
   if(resizing)duration=Math.max(15,Math.round((originalDuration+delta)/15)*15);
   else start=Math.round((originalStart+delta)/15)*15;
   card.style.top=((start-540)*80/60+2)+'px';card.style.height=(duration*80/60-4)+'px';
   card.title=clock(start)+'–'+clock(start+duration)+' · '+duration+' minutes';
   const time=card.querySelector('time');if(time)time.textContent=clock(start)+'–'+clock(start+duration);
  };
  handle.onpointerup=()=>{cleanup();suppressClick14=true;if(moved)applyTime(b,start,duration);else render();document.querySelector('[data-edit="'+id+'"]')?.focus()};
  handle.onpointercancel=cancel;
 });
}
document.addEventListener('click',e=>{if(suppressClick14){suppressClick14=false;if(e.target.closest('.event')){e.preventDefault();e.stopImmediatePropagation()}}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&gesture14){e.preventDefault();gesture14.cancel()}},true);
function savePanel(){
 if(saving14||!state().dirty)return;
 overlay('<header><h2>Save a new revision</h2><button id="close" class="plain" aria-label="Close save dialog">×</button></header><label for="reason">What changed? <span class="muted">(optional)</span></label><textarea id="reason" class="note" placeholder="Moved inbox to protect the writing block."></textarea><p class="notice">Your previous plan stays in history.</p><p id="save-error" class="error-label" role="alert" hidden>Couldn’t save this revision. Your draft and previous plans are intact.</p><button class="primary" id="confirm-save">Save revision</button>');
 $('#confirm-save').onclick=()=>{
  if(saving14)return;const s=state(),snapshot=clone(s.blocks),reason=$('#reason').value.trim()||'Updated daily plan.',button=$('#confirm-save');
  saving14=true;button.disabled=true;button.textContent='Saving…';$('#reason').readOnly=true;$('#close').disabled=true;$('#save-error').hidden=true;
  setTimeout(()=>{
   saving14=false;
   if(failNextSave){failNextSave=false;saveError=true;$('#save-error').hidden=false;button.disabled=false;button.textContent='Retry save';$('#reason').readOnly=false;$('#close').disabled=false;button.focus();return}
   saveError=false;s.saved=snapshot;s.savedTasks=clone(s.tasks);
   s.revisions.unshift({id:s.revisions[0].id+1,time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),reason,blocks:clone(snapshot)});
   s.dirty=false;closeOverlay();render();document.querySelector('[data-save]')?.focus();toast('Revision '+s.revisions[0].id+' saved in this preview.');
  },350);
 };
}
const priorClose14=closeOverlay;
closeOverlay=function(){if(saving14)return;priorClose14()};
function applyTime(b,start,duration){
 const s=state();let error='';
 if(start<540||start+duration>1080)error='Keep this sample schedule between 09:00 and 18:00.';
 else if(duration<15||duration>240)error='Choose a duration between 15 and 240 minutes.';
 else {const conflict=s.blocks.find(x=>x.id!==b.id&&start<mins(x.start)+x.duration&&start+duration>mins(x.start));if(conflict)error='Overlaps “'+conflict.title+'”. Previous time preserved.'}
 if(error){render();$('#toast').setAttribute('role','alert');toast(error);return}
 b.start=clock(start);b.duration=duration;s.blocks.sort((a,c)=>mins(a.start)-mins(c.start));changed();$('#toast').setAttribute('role','status');toast('Applied to draft. Save a revision when ready.');
}
