[tasks.dev]
description = "Run the Rust CLI help output"
run = "cargo run --bin deepblock-cli -- --help"

[tasks.start]
description = "Run the Rust CLI help output in release mode"
run = "cargo run --release --bin deepblock-cli -- --help"

[tasks.build]
description = "Build the Rust CLI"
run = "cargo build --bin deepblock-cli"

[tasks.test]
description = "Run Rust CLI tests"
run = "cargo test -p deepblock-cli"

[tasks.lint]
description = "Lint the Rust CLI"
run = "cargo clippy -p deepblock-cli --all-targets -- -D warnings && cargo fmt --all -- --check"

[tasks.fmt]
description = "Format Rust CLI code"
run = "cargo fmt --all"
